name: regen-lock

# TEMPORARY. Regenerates package-lock.json on Linux and uploads it, because the
# lockfile was authored on Windows and omits cross-platform optional deps.
# Delete this workflow once the regenerated lockfile is committed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Regenerate lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Show whether the wasm entries landed
        run: |
          grep -c '"node_modules/@emnapi/core"' package-lock.json || true
          grep -n '"@emnapi/core": "1.11' package-lock.json || true
      - uses: actions/upload-artifact@v7
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 1
