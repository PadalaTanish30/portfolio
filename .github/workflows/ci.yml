name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only read access to the repository is needed.
permissions:
  contents: read

# Cancel superseded runs for the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Deliberately `npm install` rather than `npm ci`.
      #
      # The lockfile was generated on Windows, and npm does not record the
      # transitive optional deps of a couple of wasm32 fallback packages:
      # `@emnapi/core` and `@emnapi/runtime` are only present at 1.10.0 (nested
      # under @unrs/resolver-binding-wasm32-wasi), while @img/sharp-wasm32 wants
      # ^1.11.3 and @tailwindcss/oxide-wasm32-wasi wants ^1.11.1. `npm ci`
      # validates the lockfile strictly and refuses to proceed on Linux;
      # `npm install` reconciles the tree and still honours every locked
      # version. Vercel installs the same way, so CI mirrors the real build.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
