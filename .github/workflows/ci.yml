name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only read access to the repository is needed.
permissions:
  contents: read

# Cancel superseded runs for the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` (not `npm install`): the lockfile is authoritative, so the
      # install is reproducible and fails loudly if package.json and
      # package-lock.json ever drift apart. The lockfile previously omitted the
      # transitive optional deps of the wasm32 fallback packages
      # (@tailwindcss/oxide-wasm32-wasi and friends), which made `npm ci` refuse
      # to run on Linux; it was regenerated with `--os=linux --cpu=x64` so those
      # entries are recorded.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
